name: release

# A version tag such as v0.1.0 builds the zip, tests it, and attaches it to a draft GitHub release
# with a provenance attestation. A person runs the same steps by hand for an existing tag. Nothing
# here publishes the draft or sends the plugin to WordPress.org. The tag must equal the plugin
# version and the stable tag of readme.txt.
#
# Two gates keep a bad zip from the release. The gate job stops unless the jobs of ci.yml passed
# for the tagged commit. The zip job then runs Plugin Check and the browser tests on the very zip
# that the release job attaches, and stops if the browser tests changed that file.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The existing version tag to build, such as v0.1.0.
        required: true
        type: string

permissions: {}

# One release run for each tag.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The job reads the check runs of the tagged commit.
      checks: read
    outputs:
      sha: ${{ steps.runs.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - name: Check that CI passed for the tagged commit
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?per_page=100" \
            --jq '[.check_runs[] | {id, name, status, conclusion, app: {slug: .app.slug}}]' \
            > "$RUNNER_TEMP/check-runs.json"
          php scripts/check-ci-runs.php "$RUNNER_TEMP/check-runs.json"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  zip:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # The attestation is signed with the OIDC token of the run.
      id-token: write
      # The attestation is stored with the repo.
      attestations: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          submodules: true
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
      - name: Check the tag against the plugin version
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          CHECKED_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          php scripts/check-release-tag.php "$TAG"
          sha="$(git rev-parse HEAD)"
          if [ "$sha" != "$CHECKED_SHA" ]; then
            echo "The tag $TAG moved from $CHECKED_SHA to $sha after the CI check." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # A release job must not read a cache that another run can write.
          package-manager-cache: false
      - run: composer install --no-interaction --no-progress
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: scripts/install-wp
      - run: scripts/build-zip
      - run: scripts/plugin-check
      # The browser tests install the zip in dist/ and do not build another. The sum proves that
      # they left the file alone, so the release attaches the file that they tested.
      - name: Remember the sum of the zip
        run: sha256sum dist/gatepost-postcode-for-woocommerce.zip > "$RUNNER_TEMP/zip.sha256"
      - name: Test the zip in a browser
        env:
          GATEPOST_USE_BUILT_ZIP: '1'
        run: corepack pnpm test:e2e
      - name: Check that the zip did not change
        run: sha256sum -c "$RUNNER_TEMP/zip.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/gatepost-postcode-for-woocommerce.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gatepost-postcode-for-woocommerce
          path: dist/gatepost-postcode-for-woocommerce.zip
          if-no-files-found: error
          retention-days: 14

  release:
    needs: zip
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The job creates the draft release.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gatepost-postcode-for-woocommerce
      - name: Attach the zip to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.zip.outputs.tag }}
          BUILT_SHA: ${{ needs.zip.outputs.sha }}
        run: |
          # The tag must still point to the commit that the zip came from.
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          if [ "$tag_sha" != "$BUILT_SHA" ]; then
            echo "The tag $TAG moved from $BUILT_SHA to $tag_sha during the run." >&2
            exit 1
          fi
          gh release create --draft --verify-tag --title "$TAG" --repo "$GITHUB_REPOSITORY" \
            -- "$TAG" gatepost-postcode-for-woocommerce.zip
